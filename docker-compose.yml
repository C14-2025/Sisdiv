version: '3.8'

services:
  jenkins:
    image: alexandretommasi01/meu-jenkins-customizado:latest
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - EMAIL_DESTINO=${EMAIL_DESTINO}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    networks:
      - devops-network

volumes:
  jenkins_home:
    driver: local

networks:
  devops-network:
    driver: bridge
