<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sisdiv - Sistema de Amortização de Dívidas{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="/static/script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Sisdiv - Sistema de Amortização de Dívidas</h1>
            <p>Simulação completa com métodos SAC, Price, SAM e Pagamento Variavel</p>
            <nav>
                <a href="/">Nova Simulação</a>
                <a href="/simulacoes">Histórico</a>
                <a href="/investimentos">Investimentos</a>
            </nav>
        </div>

        <div class="main-content">
            {% block content %}{% endblock %}
        </div>

        <div class="footer">
            <p>Sisdiv &copy; 2025 - Sistema de Amortização de Dívidas</p>
        </div>
    </div>
</body>
</html>
