{% extends "base.html" %}

{% block content %}
<div class="input-section">
    <h2>📝 Dados do Financiamento</h2>
    <form id="simulacaoForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="valor">Valor do Empréstimo (R$)</label>
                <input type="number" id="valor" name="valor" value="null" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="taxa">Taxa de Juros (% ao mês)</label>
                <input type="number" id="taxa" name="taxa" value="null" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="prazo">Prazo (meses)</label>
                <input type="number" id="prazo" name="prazo" value="null" min="1" required>
            </div>
            <div class="form-group">
                <label for="carencia">Carência (meses)</label>
                <input type="number" id="carencia" name="carencia" value="null" min="0">
            </div>

            <div class="form-group">
                <label for="metodo">Método de Amortização</label>
                <select id="metodo" name="metodo" onchange="toggleAmortizacoesInput()">
                    <option value="ambos">SAC e Price</option>
                    <option value="sac">SAC</option>
                    <option value="price">Price</option>
                    <option value="sam">SAM</option>
                </select>
            </div>

        </div>

        <div class="btn-group">
            <button type="submit" class="btn-calculate">🔄 Calcular Amortização</button>
            <button type="button" class="btn-secondary" onclick="limparCampos()">🗑️ Limpar</button>
        </div>
    </form>
</div>

<div class="results-section" id="resultsSection" style="display: none;">
    <div class="results-tabs">
        <button class="tab-button active" onclick="showTab('sac')">📉 SAC</button>
        <button class="tab-button" onclick="showTab('price')">📊 Price</button>
        <button class="tab-button" onclick="showTab('sam')">📊 SAM</button>
        <button class="tab-button" onclick="showTab('comparison')">⚖️ Comparação</button>
    </div>

    <div id="sac-tab" class="tab-content active">
        <h2>Sistema de Amortização Constante (SAC)</h2>
        <div class="summary-cards" id="sacSummary"></div>
        <div class="chart-container">
            <canvas id="sacChart"></canvas>
        </div>
        <div class="table-container">
            <table id="sacTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('sac')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('sac')">📋 Exportar PDF</button>
            <button class="btn-export" onclick="salvarSimulacao()">💾 Salvar Simulação</button>
        </div>
    </div>

    <div id="price-tab" class="tab-content">
        <h2>Tabela Price</h2>
        <div class="summary-cards" id="priceSummary"></div>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
        <div class="table-container">
            <table id="priceTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('price')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('price')">📋 Exportar PDF</button>
            <button class="btn-export" onclick="salvarSimulacao()">💾 Salvar Simulação</button>
        </div>
    </div>

    <div id="sam-tab" class="tab-content">
        <h2>Tabela SAM</h2>
        <div class="summary-cards" id="samSummary"></div>
        <div class="chart-container">
            <canvas id="samChart"></canvas>
        </div>
        <div class="table-container">
            <table id="samTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('sam')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('sam')">📋 Exportar PDF</button>
            <button class="btn-export" onclick="salvarSimulacao()">💾 Salvar Simulação</button>
        </div>
    </div>

    <div id="comparison-tab" class="tab-content">
        <h2>Comparação SAC vs Price</h2>
        <div class="chart-container">
            <canvas id="comparisonChart"></canvas>
        </div>
        <div class="summary-cards" id="comparisonSummary"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Adiciona o listener para submissão do formulário
        const form = document.getElementById('simulacaoForm');
        form.addEventListener('submit', handleFormSubmit);

        // Garante que o campo de amortização esteja oculto no carregamento
        toggleAmortizacoesInput();
    });

    // Supondo que você tenha a função limparCampos() no seu script.js,
    // se não tiver, pode ser adicionada aqui:
    function limparCampos() {
        document.getElementById('simulacaoForm').reset();
        document.getElementById('resultsSection').style.display = 'none';
        toggleAmortizacoesInput(); // Reseta a visibilidade do campo
    }


    // Função para mostrar/esconder o campo de amortizações (CORREÇÃO DA LÓGICA)
    function toggleAmortizacoesInput() {
        const metodo = document.getElementById('metodo').value;
        const amortizacoesGroup = document.getElementById('amortizacoesGroup');
        const amortizacoesInput = document.getElementById('amortizacoes_input');
        const prazoInput = document.getElementById('prazo');

        // Proteção: se os elementos não existirem, sair
        if (!amortizacoesGroup || !amortizacoesInput || !prazoInput) return;

    }

    // Função que lida com a submissão do formulário e prepara o campo amortizacoes_json
    async function handleFormSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);
        const metodo = formData.get('metodo');

        const resultsSection = document.getElementById('resultsSection');
        resultsSection.style.display = 'none'; // Esconde resultados antigos

        // Submissão via Fetch API
        try {
            const response = await fetch('/calcular/', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                alert(`Erro no cálculo: ${data.detail || 'Ocorreu um erro desconhecido.'}`);
                return;
            }

            if (typeof renderResults === 'function') {
                 // Função definida em script.js (esperado)
                 renderResults(data);
            } else {
                console.error("Função renderResults não encontrada. Resultados calculados:", data);
                resultsSection.style.display = 'block';
            }

        } catch (error) {
            console.error('Erro de rede ou na requisição:', error);
            alert('Erro de comunicação com o servidor.');
        }
    }
</script>
{% endblock %}
