{% extends "base.html" %}

{% block content %}
<div class="input-section">
    <h2>📝 Dados do Financiamento</h2>
    <form id="simulacaoForm">
        <div class="form-grid">
            <div class="form-group">
                <label for="valor">Valor do Empréstimo (R$)</label>
                <input type="number" id="valor" name="valor" value="null" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="taxa">Taxa de Juros (% ao mês)</label>
                <input type="number" id="taxa" name="taxa" value="null" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="prazo">Prazo (meses)</label>
                <input type="number" id="prazo" name="prazo" value="null" min="1" required>
            </div>
            <div class="form-group">
                <label for="carencia">Carência (meses)</label>
                <input type="number" id="carencia" name="carencia" value="null" min="0">
            </div>

            <div class="form-group hidden-field" id="amortizacoesGroup" style="display: none;">
                <label for="amortizacoes_input">Lista de Amortizações (separadas por vírgula)</label>
                <textarea id="amortizacoes_input" rows="3" placeholder="Ex: 8000.00, 7500.00, 7000.00, ..."></textarea>
                <input type="hidden" id="amortizacoes_json" name="amortizacoes_json">
            </div>

            <div class="form-group">
                <label for="metodo">Método de Amortização</label>
                <select id="metodo" name="metodo" onchange="toggleAmortizacoesInput()">
                    <option value="ambos">SAC, Price, SAM e Pagamento Variavel</option>
                    <option value="sac">SAC</option>
                    <option value="sam">SAM</option>
                    <option value="pagamento_variavel">Pagamento Variavel</option>
                    <option value="price">Price</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-calculate">🔄 Calcular Amortização</button>
            <button type="button" class="btn-secondary" onclick="limparCampos()">🗑️ Limpar</button>
        </div>
    </form>
</div>

<div class="results-section" id="resultsSection" style="display: none;">
    <div class="results-tabs">
        <button class="tab-button active" onclick="showTab('sac')">📉 SAC</button>
        <button class="tab-button" onclick="showTab('price')">📊 Price</button>
        <button class="tab-button" onclick="showTab('sam')">📊 SAM</button>
        <button class="tab-button" onclick="showTab('pagamento_variavel')">📊 Pagamento Variavel</button>
        <button class="tab-button" onclick="showTab('comparison')">⚖️ Comparação</button>
    </div>

    <div id="sac-tab" class="tab-content active">
        <h2>Sistema de Amortização Constante (SAC)</h2>
        <div class="summary-cards" id="sacSummary"></div>
        <div class="chart-container">
            <canvas id="sacChart"></canvas>
        </div>
        <div class="table-container">
            <table id="sacTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('sac')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('sac')">📋 Exportar PDF</button>
            <button class="btn-export" onclick="salvarSimulacao()">💾 Salvar Simulação</button>
        </div>
    </div>

    <div id="price-tab" class="tab-content">
        <h2>Tabela Price</h2>
        <div class="summary-cards" id="priceSummary"></div>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
        <div class="table-container">
            <table id="priceTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('price')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('price')">📋 Exportar PDF</button>
        </div>
    </div>

    <div id="sam-tab" class="tab-content">
        <h2>Tabela SAM</h2>
        <div class="summary-cards" id="samSummary"></div>
        <div class="chart-container">
            <canvas id="samChart"></canvas>
        </div>
        <div class="table-container">
            <table id="samTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('sam')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('sam')">📋 Exportar PDF</button>
        </div>
    </div>

    <div id="pagamento_variavel-tab" class="tab-content">
        <h2>Tabela Pagamento Variavel</h2>
        <div class="summary-cards" id="pagamento_variavelSummary"></div>
        <div class="chart-container">
            <canvas id="pagamento_variavelChart"></canvas>
        </div>
        <div class="table-container">
            <table id="pagamento_variavelTable"></table>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToCSV('pagamento_variavel')">📄 Exportar CSV</button>
            <button class="btn-export" onclick="exportToPDF('pagamento_variavel')">📋 Exportar PDF</button>
        </div>
    </div>

    <div id="comparison-tab" class="tab-content">
        <h2>Comparação SAC vs Price vs SAM vs Pagamento Variavel</h2>
        <div class="chart-container">
            <canvas id="comparisonChart"></canvas>
        </div>
        <div class="summary-cards" id="comparisonSummary"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Assume-se que o código de submissão do formulário está em script.js,
        // mas adicionamos o listener aqui para a submissão.
        const form = document.getElementById('simulacaoForm');
        form.addEventListener('submit', handleFormSubmit);

        // Garante que o campo de amortização esteja oculto no carregamento
        toggleAmortizacoesInput();
    });

    // Função para mostrar/esconder o campo de amortizações
    function toggleAmortizacoesInput() {
        const metodo = document.getElementById('metodo').value;
        const amortizacoesGroup = document.getElementById('amortizacoesGroup');
        const amortizacoesInput = document.getElementById('amortizacoes_input');

        // Exibe o campo se o método for Pagamento Variável ou Ambos
        if (metodo === 'pagamento_variavel' || metodo === 'ambos') {
            amortizacoesGroup.style.display = 'block';
            amortizacoesInput.setAttribute('required', 'required');
            document.getElementById('prazo').removeAttribute('required'); // Prazo não é estritamente necessário se amortizações for fornecido
        } else {
            amortizacoesGroup.style.display = 'none';
            amortizacoesInput.removeAttribute('required');
            document.getElementById('prazo').setAttribute('required', 'required');
            // Limpa o campo hidden e o textarea para não enviar dados desnecessários
            document.getElementById('amortizacoes_json').value = '';
            amortizacoesInput.value = '';
        }
    }

    // Função que lida com a submissão do formulário e prepara o campo amortizacoes_json
    async function handleFormSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);
        const metodo = formData.get('metodo');

        const resultsSection = document.getElementById('resultsSection');
        resultsSection.style.display = 'none'; // Esconde resultados antigos

        // Lógica de Pagamento Variável
        if (metodo === 'pagamento_variavel' || metodo === 'ambos') {
            const amortizacoesInput = document.getElementById('amortizacoes_input').value;
            const amortizacoesJsonField = document.getElementById('amortizacoes_json');

            // 1. Processa a string de amortizações (separada por vírgulas)
            const amortizacoesArray = amortizacoesInput
                .split(',')
                .map(s => s.trim()) // Remove espaços em branco
                .filter(s => s.length > 0) // Remove strings vazias
                .map(s => parseFloat(s)); // Converte para número float

            // 2. Valida se todos os elementos são números válidos
            if (amortizacoesArray.some(isNaN)) {
                alert('Erro: A lista de amortizações contém valores não numéricos. Por favor, insira apenas números separados por vírgula.');
                return;
            }

            // 3. Serializa a lista de números para JSON e a coloca no campo hidden
            amortizacoesJsonField.value = JSON.stringify(amortizacoesArray);

            // 4. Adiciona o campo hidden ao FormData antes de submeter
            formData.append('amortizacoes_json', amortizacoesJsonField.value);

            // O campo 'prazo' é definido automaticamente pelo tamanho da lista de amortizações
            // na função Python, mas o formulário ainda pode exigir um valor para os outros métodos.
            // Para 'Pagamento Variavel', o 'prazo' no input HTML pode ser ignorado ou usado como
            // uma validação de consistência. No backend, ele é ignorado para este método.
        }


        // Submissão via Fetch API (Assumindo que essa é a maneira como o seu site envia dados)
        try {
            const response = await fetch('/calcular/', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                // Se houver erro HTTP (400, 500, etc.)
                alert(`Erro no cálculo: ${data.detail || 'Ocorreu um erro desconhecido.'}`);
                return;
            }

            // Assumindo que você tem uma função 'renderResults' em 'script.js'
            if (typeof renderResults === 'function') {
                 // Esta função deve estar definida em seu script.js para exibir a tabela
                 renderResults(data);
            } else {
                console.error("Função renderResults não encontrada. Resultados calculados:", data);
                // Exibe a seção de resultados manualmente para indicar sucesso
                resultsSection.style.display = 'block';
            }

            // Resto da lógica de exibição de resultados...

        } catch (error) {
            console.error('Erro de rede ou na requisição:', error);
            alert('Erro de comunicação com o servidor.');
        }
    }
</script>
{% endblock %}
